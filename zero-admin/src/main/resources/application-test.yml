#nacos配置
spring:
  # Spring Boot 配置加载设置。
  config:
    # Spring Cloud Alibaba 2025.x 推荐使用 spring.config.import 导入 Nacos 配置
    import:
      # 导入 JDBC 数据源和连接池配置。
      - optional:nacos:zero-admin-mysql.yml?group=${spring.profiles.active}&refreshEnabled=true
      # 导入 Redis 连接和客户端连接池配置。
      - optional:nacos:zero-admin-redis.yml?group=${spring.profiles.active}&refreshEnabled=true
      # 导入当前服务的通用配置。
      - optional:nacos:zero-admin-common.yml?group=${spring.profiles.active}&refreshEnabled=true
      # 导入管理后台 WebSocket 连接与消息通道配置。
      - optional:nacos:zero-admin-websocket.yml?group=${spring.profiles.active}&refreshEnabled=true
    # 服务模块
  # Spring Boot 开发工具配置。
  devtools:
    # 开发期应用自动重启配置。
    restart:
      # 热部署开关
      enabled: true
  # Spring Cloud 服务发现、配置导入及调用设置。
  cloud:
    nacos: #注册中心
      # Nacos 实例注册和服务发现配置。
      discovery:
        # Nacos 服务发现地址。
        server-addr: 127.0.0.1:8848
        # Nacos 服务注册和发现所用的命名空间 ID。
        namespace: d2785810-7346-4859-bcfa-f3bf929a628f
        # 注册及发现服务时使用的 Nacos 认证账号。
        username: nacos
        # 注册及发现服务时使用的 Nacos 认证密码。
        password: nacos
        enabled: true #是否启用服务发现，默认为true
        ephemeral: true # 是否临时实例
      config: #配置中心
        # 控制是否启用 Nacos 配置中心。
        enabled: true
        # Nacos 配置中心地址。
        server-addr: 127.0.0.1:8848
        # Nacos 配置中心的命名空间 ID。
        namespace: d2785810-7346-4859-bcfa-f3bf929a628f
        # 访问 Nacos 配置中心的认证账号。
        username: nacos
        # 访问 Nacos 配置中心的认证密码。
        password: nacos
        # Nacos 配置文件的默认扩展名。
        file-extension: yml
        # 控制是否监听支持刷新的 Nacos 配置变更，启动阶段创建的对象按各自的刷新机制生效。
        refresh-enabled: true
