# Zero 项目自身的业务和基础设施配置。
zero:
  # 项目对外展示的名称。
  name: Zero管理后台
  # 项目页面或输出信息使用的版本号。
  version: 1.0.0
  # 项目页面或输出信息使用的版权年份。
  copyrightYear: 2026
  # 应用本地文件存储根目录。
  profile: D:/zero/uploadPath
  # 登录验证码的生成类型。
  captchaType: math
# 管理后台用户配置。
user:
  # 管理后台登录密码策略。
  password:
    # 密码连续校验失败的最大次数。
    maxRetryCount: 5
    # 达到登录失败次数上限后的锁定时间，单位分钟。
    lockTime: 1
# Spring Boot 及相关组件的配置。
spring:
  # 国际化消息资源配置。
  messages:
    # 国际化资源束名称，多个资源束可用逗号分隔。
    basename: i18n/messages
  # Servlet 请求处理配置。
  servlet:
    # Multipart 文件上传配置。
    multipart:
      # 单个上传文件的最大体积。
      max-file-size: 30MB
      # 一次 Multipart 请求的总大小上限。
      max-request-size: 60MB
