# WebSocket仅承载在线消息，频道必须按环境隔离且所有admin节点一致，不存储离线消息。
# 本文件是Nacos配置源文件，修改本地文件不会同步修改Nacos。
# 以下按500人在线、每人通常1～3个标签页、约1500条连接规划，以定向通知为主、偶尔全员广播。
# 此为容量规划基线，实际承载能力需结合节点资源、消息频率、Redis延迟及压测确认。
# 当前配置使用不可变record绑定，且频道订阅、来源校验、容器、线程池和定时任务在启动时创建。
# 不依赖Nacos热更新：发布变更后须按部署流程重启admin节点，并核对实际生效值。
# channel变更会同时切换消息频道和连接租约键前缀，须协调所有节点切换；混用期间消息可能漏达，连接配额分开计数。
zero:
  websocket:
    # Redis发布订阅频道：同一环境的所有admin节点必须一致，不同环境必须不同。
    # 优先使用当前激活的profile，无profile时使用default；Redis不同DB不能隔离Pub/Sub频道。
    # profile相同但部署相互独立且共享Redis时，须分别指定独立频道；Nacos namespace/group本身不能隔离此频道。
    channel: zero:${spring.profiles.active:default}:admin:ws
    # 允许建立连接的浏览器页面源；空列表保持同源校验，不允许任意来源通配符。
    # 跨域示例：["https://admin.example.com"]；填写协议、域名及必要端口，不包含路径。
    allowed-origins: []
    # 首帧Token认证期限，单位毫秒；5000=5秒，最小1000。
    # 超时关闭连接并允许重试，不将网络延迟判定为HTTP登录失效。
    auth-timeout: 5000
    # 认证成功后告知浏览器的心跳发送间隔，单位毫秒；30000=30秒，最小1000。
    # 心跳只用于检测连接，不延长HTTP登录有效期；必须小于idle-timeout。
    # 当前空闲期限为3个心跳周期；代理/LB空闲超时须留出网络及调度余量，部署示例使用120秒。
    heartbeat-interval: 30000
    # 连接空闲超时，单位毫秒；90000=90秒，最小1000，必须大于心跳间隔。
    # 服务端未收到客户端有效消息，或前端未收到服务端消息达到此时长，将断开并重连。
    idle-timeout: 90000
    # 本节点集中检查登录会话和续租连接名额的间隔，单位毫秒；30000=30秒，最小1000。
    # 退出、强退或登录过期后关闭关联连接；不刷新登录有效期，业务投递前还会再次校验。
    # 实际关闭还受本轮扫描耗时影响；租约期限=max(idle-timeout, session-check-interval*3)，当前为90秒。
    session-check-interval: 30000
    # 单条文本消息的最大UTF-8字节数；65536=64KiB，最小1024。
    # 限制认证首帧、心跳和业务消息大小；中文等字符按实际编码字节计算，不是字符数。
    max-text-bytes: 65536
    # 每个登录会话在所有admin节点合计允许的连接数，最小1；通过Redis租约统一控制。
    # 同一会话的多个浏览器标签页分别计数；同账号的独立登录会话分别计算。
    max-connections-per-session: 10
    # 单个admin节点允许同时存在的待认证连接数，最小1；达到上限拒绝新增连接。
    # 仅统计尚未完成首帧认证的连接，不是在线用户数或已认证连接总数。
    # 为集中登录及断线重连预留名额；此上限不是每秒认证处理能力。
    max-pending-connections: 500
    # 单连接发送超时，单位毫秒；10000=10秒，最小1000。
    # 用于容器写入超时及慢连接检查，超时清理连接；不代表浏览器已收到或处理业务消息。
    send-timeout: 10000
    # 单连接并发发送保护缓冲区上限，单位字节；262144=256KiB，最小1024。
    # 仅限制并发发送装饰器内部缓冲，不包含发送线程池等待任务；不能视为单连接全部待发送数据的内存上限。
    # 装饰器缓冲超过上限时关闭连接；独立发送超时检查负责清理正在写入的慢连接。
    send-buffer-bytes: 262144
    # 每个admin节点的发送线程数，最小1；核心和最大线程数均使用此值。
    # Redis订阅回调提交发送任务，实际写入由此线程池执行，避免慢连接阻塞订阅线程。
    # 发送任务包含Redis登录校验、租约续期及连接写入，使用8个线程作为压测起点。
    send-threads: 8
    # 每个admin节点发送线程池的等待任务上限，单位为任务个数，最小1。
    # 队列满时拒绝任务并关闭对应连接，不回到Redis订阅线程同步发送；不用于离线消息存储。
    # 全节点连接共享此队列；满队列可能关闭正常连接，不能据此认定对应客户端一定是慢连接。
    # send-timeout限制写入阶段，不限制任务排队或Redis校验耗时；增大队列不保证提升吞吐，调整前检查Redis延迟和慢连接。
    # 按约1500条连接的一轮广播及部分心跳任务预留空间，不保证连续广播时不发生拥塞。
    send-queue-capacity: 3000
