# Spring Boot 及相关组件的配置。
spring:
  # JDBC 数据源及连接池设置。
  datasource:
    # 数据源实现类。
    type: com.alibaba.druid.pool.DruidDataSource
    # 用于建立 JDBC 连接的驱动类。
    driverClassName: com.mysql.cj.jdbc.Driver
    # Druid 数据源和 SQL 监控设置。
    druid:
      # 管理后台主数据源连接配置。
      master:
        # 该数据源的 JDBC 连接地址。
        url: jdbc:mysql://127.0.0.1:3306/zero_admin?useUnicode=true&characterEncoding=utf8&zeroDateTimeBehavior=convertToNull&useSSL=false&serverTimezone=GMT%2B8
        # 该数据源的数据库账号。
        username: root
        # 该数据源的数据库密码。
        password: 8!4hFfBDr7*R<Js79tJnk:BX9ljN
      # 管理后台可选的从数据源连接配置。
      slave:
        # 控制是否装配管理后台的从数据源。
        enabled: false
        # 该数据源的 JDBC 连接地址。
        url: 
        # 该数据源的数据库账号。
        username: 
        # 该数据源的数据库密码。
        password: 
      # 连接池初始化时创建的连接数。
      initialSize: 5
      # 连接池的最少空闲连接数。
      minIdle: 10
      # 连接池允许同时使用的最大连接数。
      maxActive: 20
      # 连接池借用连接时的最长等待时间，单位毫秒。
      maxWait: 60000
      # JDBC 建立连接的超时时间，单位毫秒。
      connectTimeout: 30000
      # JDBC 连接读取数据时的超时时间，单位毫秒。
      socketTimeout: 60000
      # 连接池执行空闲连接检测的间隔，单位毫秒。
      timeBetweenEvictionRunsMillis: 60000
      # 空闲连接允许被逐出的最短空闲时间，单位毫秒。
      minEvictableIdleTimeMillis: 300000
      # 空闲连接允许保留的最长空闲时间，单位毫秒。
      maxEvictableIdleTimeMillis: 900000
      # 检查数据库连接是否可用时执行的 SQL。
      validationQuery: SELECT 1 FROM DUAL
      # 空闲连接是否参与定期可用性检查。
      testWhileIdle: true
      # 借出连接前是否做可用性检查。
      testOnBorrow: false
      # 归还连接时是否做可用性检查。
      testOnReturn: false
      # Druid Web 请求与 JDBC 关联统计过滤器配置。
      webStatFilter:
        # 控制是否启用 Druid Web 请求统计。
        enabled: true
      # Druid 监控页面入口与访问设置。
      statViewServlet:
        # 控制是否启用 Druid 监控页面。
        enabled: true
        # 允许访问 Druid 监控页面的客户端地址范围。
        allow:
        # Druid 监控页面的 Servlet URL 匹配规则。
        url-pattern: /druid/*
        # Druid 监控页面的登录账号。
        login-username: zero
        # Druid 监控页面的登录密码。
        login-password: 123456
      # Druid 连接池过滤器和 SQL 检查配置。
      filter:
        # SQL 统计过滤器配置。
        stat:
          # 控制是否启用 Druid SQL 统计过滤器。
          enabled: true
          # 控制是否记录超过阈值的慢 SQL。
          log-slow-sql: true
          # 判定慢 SQL 的耗时阈值，单位毫秒。
          slow-sql-millis: 1000
          # 是否将结构相同的 SQL 归并后统计。
          merge-sql: true
        # Druid SQL 防火墙过滤器配置。
        wall:
          # 配置 SQL 防火墙的检查规则。
          config:
            # 是否允许在一次执行中提交多条 SQL。
            multi-statement-allow: true
