# Spring
spring:
  application:
    # 应用名称
    name: zero-report
  profiles:
    # 默认环境，可通过启动参数 --spring.profiles.active=test/prod 覆盖
    active: dev
  cloud:
    openfeign:
      client:
        config:
          default:
            connectTimeout: 5000
            readTimeout: 30000
            loggerLevel: basic
---
# Tomcat
server:
  # 服务端口
  port: 9101
  servlet:
    # 应用访问路径
    context-path: /
  tomcat:
    # URI编码
    uri-encoding: UTF-8
    # 连接数满后的排队数量
    accept-count: 1000
    threads:
      # 最大工作线程数
      max: 800
      # 最小空闲线程数
      min-spare: 100
---
# 日志配置
logging:
  config: classpath:logback-spring.xml
  level:
    root: INFO
    org.springframework: warn
---
# MyBatis-Plus配置
mybatis-plus:
  # Mapper XML扫描路径
  mapper-locations: classpath*:mapper/**/*Mapper.xml
  # 实体类型别名扫描路径
  type-aliases-package: ${zero.package.type-aliases-package:com.zero.**.domain}
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false
    db-config:
      id-type: auto
---
# PageHelper分页插件
pagehelper:
  helperDialect: mysql
  reasonable: false
  supportMethodsArguments: true
  params: count=countSql
---
# 监控端点配置
management:
  endpoints:
    web:
      exposure:
        # 向Boot Admin开放全部可用监控端点，部署时须限制访问来源
        include: "*"
  endpoint:
    health:
      show-details: always
