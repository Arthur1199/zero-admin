#nacos配置
spring:
  config:
    # Spring Cloud Alibaba 2025.x 推荐使用 spring.config.import 导入 Nacos 配置
    import:
      - optional:nacos:zero-report-mysql.yml?group=${spring.profiles.active}&refreshEnabled=true
      - optional:nacos:zero-report-redis.yml?group=${spring.profiles.active}&refreshEnabled=true
      - optional:nacos:zero-report-common.yml?group=${spring.profiles.active}&refreshEnabled=true
    # 服务模块
  devtools:
    restart:
      # 热部署开关
      enabled: true
  cloud:
    nacos: #注册中心
      discovery:
        server-addr: 127.0.0.1:8848
        namespace: d2785810-7346-4859-bcfa-f3bf929a628f
        username: nacos
        password: nacos
        enabled: true #是否启用服务发现，默认为true
        ephemeral: true # 是否临时实例
      config: #配置中心
        enabled: true
        server-addr: 127.0.0.1:8848
        namespace: d2785810-7346-4859-bcfa-f3bf929a628f
        username: nacos
        password: nacos
        file-extension: yml
        refresh-enabled: true
