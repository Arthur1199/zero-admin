# 文件服务的 Nacos 配置模板，Data ID 为 zero-file-storage-config.yml，按当前环境分组可选导入。
# 各存储平台实例和本地访问映射在启动时装配，修改相关配置并发布后重启文件服务。
# Spring Boot 配置。
spring:
  # 文件服务的存储平台和文件访问配置。
  file-storage:
    # 上传请求未指定平台时使用的默认平台标识，必须对应一个已启用的平台。
    default-platform: local-1
    # 生成缩略图时追加到文件名后的后缀，只用于命名。
    thumbnail-suffix: ".min.jpg"
    # 本地磁盘存储实例列表，可按平台标识配置多个实例。
    local:
      # 存储实例的唯一标识，用于选择上传平台和定位已保存的文件。
      - platform: local-1
        # 是否启用该本地磁盘存储实例，默认关闭。
        enable-storage: true
        # 是否注册本地文件的 HTTP 访问映射，默认关闭，与启用上传的开关独立。
        enable-access: true
        # 生成本地文件链接时使用的地址前缀。末尾保留 /，并与实际 HTTP 访问路径对应。
        domain: "http://127.0.0.1:9103/file/"
        # 文件保存和 HTTP 映射使用的本地目录。当前相对路径基于 JVM 工作目录，末尾保留 /。
        base-path: fileLocal/
        # 本地文件的 HTTP 路径匹配规则。/file/** 匹配 /file/ 下的文件，需与 domain 的路径前缀对应。
        path-patterns: /file/**
    # 华为云对象存储 OBS 实例列表。
    huawei-obs:
      # 存储实例的唯一标识，用于选择上传平台和定位已保存的文件。
      - platform: huawei-obs-1
        # 是否装配该存储实例，默认关闭。云存储还需对应的 SDK。
        enable-storage: false
        # 存储服务访问密钥的 ID，用于客户端认证。
        access-key: ??
        # 与访问标识配对的私密密钥，用于客户端认证。
        secret-key: ??
        # 存储客户端使用的 API 接入地址，填写存储桶所在区域对应的服务地址。
        end-point: ??
        # 文件和缩略图存放的目标存储桶名称。
        bucket-name: ??
        # 生成文件和缩略图访问链接时使用的地址前缀，末尾保留 /。
        domain: ??
        # 桶内对象键的固定前缀，有值时末尾保留 /，留空时直接使用上传路径。
        base-path: hy/
    # 阿里云对象存储 OSS 实例列表。
    aliyun-oss:
      # 存储实例的唯一标识，用于选择上传平台和定位已保存的文件。
      - platform: aliyun-oss-1
        # 是否装配该存储实例，默认关闭。云存储还需对应的 SDK。
        enable-storage: false
        # 存储服务访问密钥的 ID，用于客户端认证。
        access-key: ??
        # 与访问标识配对的私密密钥，用于客户端认证。
        secret-key: ??
        # 存储客户端使用的 API 接入地址，填写存储桶所在区域对应的服务地址。
        end-point: ??
        # 文件和缩略图存放的目标存储桶名称。
        bucket-name: ??
        # 生成文件和缩略图访问链接时使用的地址前缀，末尾保留 /。
        domain: ??
        # 桶内对象键的固定前缀，有值时末尾保留 /，留空时直接使用上传路径。
        base-path: hy/
    # 七牛云对象存储 Kodo 实例列表，由 SDK 自动识别存储区域。
    qiniu-kodo:
      # 存储实例的唯一标识，用于选择上传平台和定位已保存的文件。
      - platform: qiniu-kodo-1
        # 是否装配该存储实例，默认关闭。云存储还需对应的 SDK。
        enable-storage: false
        # 存储服务访问密钥的 ID，用于客户端认证。
        access-key: ??
        # 与访问标识配对的私密密钥，用于客户端认证。
        secret-key: ??
        # 文件和缩略图存放的目标存储桶名称。
        bucket-name: ??
        # 生成文件和缩略图访问链接时使用的地址前缀，末尾保留 /。
        domain: ??
        # 桶内对象键的固定前缀，有值时末尾保留 /，留空时直接使用上传路径。
        base-path: base/
    # 腾讯云对象存储 COS 实例列表。
    tencent-cos:
      # 存储实例的唯一标识，用于选择上传平台和定位已保存的文件。
      - platform: tencent-cos-1
        # 是否装配该存储实例，默认关闭。云存储还需对应的 SDK。
        enable-storage: false
        # 腾讯云 API 密钥的 SecretId，用于 COS 客户端认证。
        secret-id: ??
        # 与访问标识配对的私密密钥，用于客户端认证。
        secret-key: ??
        # 目标存储桶所在的云服务区域，用于创建存储客户端。
        region: ??
        # 文件和缩略图存放的目标存储桶名称。
        bucket-name: ??
        # 生成文件和缩略图访问链接时使用的地址前缀，末尾保留 /。
        domain: ??
        # 桶内对象键的固定前缀，有值时末尾保留 /，留空时直接使用上传路径。
        base-path: hy/
    # 百度智能云对象存储 BOS 实例列表。
    baidu-bos:
      # 存储实例的唯一标识，用于选择上传平台和定位已保存的文件。
      - platform: baidu-bos-1
        # 是否装配该存储实例，默认关闭。云存储还需对应的 SDK。
        enable-storage: false
        # 存储服务访问密钥的 ID，用于客户端认证。
        access-key: ??
        # 与访问标识配对的私密密钥，用于客户端认证。
        secret-key: ??
        # 存储客户端使用的 API 接入地址，填写存储桶所在区域对应的服务地址。
        end-point: ??
        # 文件和缩略图存放的目标存储桶名称。
        bucket-name: ??
        # 生成文件和缩略图访问链接时使用的地址前缀，末尾保留 /。
        domain: ??
        # 桶内对象键的固定前缀，有值时末尾保留 /，留空时直接使用上传路径。
        base-path: hy/
    # 又拍云云存储 USS 实例列表。
    upyun-uss:
      # 存储实例的唯一标识，用于选择上传平台和定位已保存的文件。
      - platform: upyun-uss-1
        # 是否装配该存储实例，默认关闭。云存储还需对应的 SDK。
        enable-storage: false
        # 又拍云存储服务授权的操作员账号。
        username: ??
        # 又拍云存储服务操作员账号对应的密码。
        password: ??
        # 又拍云的存储服务名称，用于定位操作员有权访问的服务。
        bucket-name: ??
        # 生成文件和缩略图访问链接时使用的地址前缀，末尾保留 /。
        domain: ??
        # 桶内对象键的固定前缀，有值时末尾保留 /，留空时直接使用上传路径。
        base-path: hy/
    # MinIO 对象存储实例列表。
    minio:
      # 存储实例的唯一标识，用于选择上传平台和定位已保存的文件。
      - platform: minio-1
        # 是否装配该存储实例，默认关闭。云存储还需对应的 SDK。
        enable-storage: false
        # 存储服务访问密钥的 ID，用于客户端认证。
        access-key: admin
        # 与访问标识配对的私密密钥，用于客户端认证。
        secret-key: admin123
        # MinIO 客户端连接的 API 根地址，包含协议及实际端口，地址中无需附加桶名。
        end-point: http://16.162.108.175:9000
        # 文件和缩略图存放的目标存储桶名称。
        bucket-name: saas-bb8
        # 用于生成文件访问链接的地址前缀。使用 MinIO 的路径式访问时，前缀须包含桶名并以 / 结尾。
        domain: http://16.162.108.175:9000/saas-bb8/
        # 桶内对象键的固定前缀，有值时末尾保留 /，留空时直接使用上传路径。
        base-path:
    # Amazon S3 存储实例列表，可配置自定义 S3 接口地址。
    aws-s3:
      # 存储实例的唯一标识，用于选择上传平台和定位已保存的文件。
      - platform: aws-s3-1
        # 是否装配该存储实例，默认关闭。云存储还需对应的 SDK。
        enable-storage: true
        # 存储服务访问密钥的 ID，用于客户端认证。
        access-key: AKIARZDBIDXDBXYGNIIK
        # 与访问标识配对的私密密钥，用于客户端认证。
        secret-key: pbm57EJBBdV7HX/sGaoSj0IQF236n84wZJ2fUQvn
        # 目标存储桶的 AWS 区域。填写自定义接入地址时，该值用于签名。
        region: ap-east-1
        # 可选的自定义 S3 API 接入地址。留空时，SDK 按配置的区域选择标准 AWS S3 接入地址。
        end-point:
        # 文件和缩略图存放的目标存储桶名称。
        bucket-name: sck-sit-assets
        # 用于生成文件访问链接的地址前缀，可填写桶的访问地址或 CDN 地址，末尾保留 /。
        domain: https://sck-ws-s3.tiuiiaay.com/
        # 桶内对象键的固定前缀，有值时末尾保留 /，留空时直接使用上传路径。
        base-path: uploads/