# Spring Boot 及相关组件的配置。
spring:
  # 文件存储平台、访问地址及上传读写配置。
  file-storage:
    # 上传未显式指定平台时选用的存储平台标识。
    default-platform: aws-s3-1
    # 缩略图文件名追加的后缀。
    thumbnail-suffix: ".min.jpg"
    # 本地文件存储平台配置列表。
    local:
      # 本配置项对应的存储平台标识。
      - platform: local-1
        # 控制该平台是否参与文件存储。
        enable-storage: false
        # 控制是否通过应用注册本地文件访问映射。
        enable-access: true
        # 生成文件访问地址所使用的基础 URL。
        domain: "http://127.0.0.1:8017/file/"
        # 文件存储的基础路径，本地使用磁盘路径，对象存储使用对象路径前缀。
        base-path: fileLocal/
        # 应用对外映射本地文件的 URL 匹配模式。
        path-patterns: /file/**
    # 华为云 OBS 存储平台配置列表。
    huawei-obs:
      # 本配置项对应的存储平台标识。
      - platform: huawei-obs-1
        # 控制该平台是否参与文件存储。
        enable-storage: false
        # 访问存储服务使用的访问密钥标识。
        access-key: ??
        # 访问存储服务使用的密钥。
        secret-key: ??
        # 对象存储服务的连接端点。
        end-point: ??
        # 存储桶或服务空间的名称。
        bucket-name: ??
        # 生成文件访问地址所使用的基础 URL。
        domain: ??
        # 文件存储的基础路径，本地使用磁盘路径，对象存储使用对象路径前缀。
        base-path: hy/
    # 阿里云 OSS 存储平台配置列表。
